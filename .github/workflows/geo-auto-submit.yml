name: Global SEO & AI GEO Auto-Ingestion

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs to submit (one per line, overrides defaults)'
        required: false

permissions:
  contents: read

jobs:
  indexnow-submit:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build submission URLs
        env:
          INDEXNOW_URLS_INPUT: ${{ github.event.inputs.urls }}
          INDEXNOW_TARGET_SHA: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || github.sha }}
        run: |
          set -euo pipefail
          node scripts/build-indexnow-submission.mjs > urls.json
          echo 'Submission list:' && cat urls.json
          {
            echo "## IndexNow submission batch"
            echo
            echo "- URL count: $(jq 'length' urls.json)"
            echo "- Source event: ${GITHUB_EVENT_NAME}"
            if [ "${GITHUB_EVENT_NAME}" = "deployment_status" ]; then
              echo "- Deployment ref: ${{ github.event.deployment.ref }}"
              echo "- Deployment SHA: ${{ github.event.deployment.sha }}"
            fi
            echo
            echo '```json'
            cat urls.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Submit to IndexNow (Bing, Yandex, Naver, Seznam, 50+ engines)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${INDEXNOW_KEY:-}" ]; then
            echo "::error::INDEXNOW_KEY secret is missing"
            exit 1
          fi
          URLS=$(jq -c '.' urls.json)
          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"www.foxue.ai\",
              \"key\": \"${INDEXNOW_KEY}\" ,
              \"keyLocation\": \"https://www.foxue.ai/${INDEXNOW_KEY}.txt\",
              \"urlList\": ${URLS}
            }")
          echo "IndexNow response: HTTP $HTTP_CODE"
          cat "$RESPONSE_FILE"
          case "$HTTP_CODE" in
            200|202)
              ;;
            *)
              echo "::error::IndexNow submission failed with HTTP $HTTP_CODE"
              exit 1
              ;;
          esac

      - name: Save to Wayback Machine (AI training datasets)
        continue-on-error: true
        run: |
          set -euo pipefail
          for url in $(jq -r '.[]' urls.json); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 15 --max-time 120 "https://web.archive.org/save/$url")
            echo "Wayback $url → HTTP $CODE"
            sleep 5
          done
