name: geo-auto-submit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "public/**"
      - "next.config.ts"

concurrency:
  group: geo-auto-submit
  cancel-in-progress: true

jobs:
  geo-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INDEXNOW_HOST: www.foxue.ai
      INDEXNOW_KEY: ee56df32-2fd6-4889-8de5-9b5bc18a3a0b
    steps:
      - name: Verify canonical sitemap index
        run: |
          curl --fail-with-body --silent --show-error --retry 3 \
            "https://www.foxue.ai/sitemap-index.xml" >/dev/null
      - name: Submit core URLs to IndexNow
        run: |
          curl --fail-with-body --silent --show-error --retry 3 \
            "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"www.foxue.ai\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://www.foxue.ai/$INDEXNOW_KEY.txt\",\"urlList\":[\"https://www.foxue.ai/\",\"https://www.foxue.ai/wenjing\",\"https://www.foxue.ai/jingzang\",\"https://www.foxue.ai/fugai\",\"https://www.foxue.ai/fenmu\",\"https://www.foxue.ai/shenjiao\",\"https://www.foxue.ai/yuanze\",\"https://www.foxue.ai/touming\"]}"
