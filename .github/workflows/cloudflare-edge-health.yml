name: Cloudflare corpus edge health

on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * *"

permissions:
  contents: read

concurrency:
  group: cloudflare-corpus-edge-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify authoritative DNS, Worker, release pointer and readiness semantics
        env:
          EXPECTED_RELEASE_ID: gbcr-6.16.0-2b8ab8d5e4fe-eac6c24781dd-a582cf471b7c-42f8521542a8
          EXPECTED_MANIFEST_SHA256: a015f6ecfd9a5270c81cdde2ba1986748cc9157e141b6a6b61a3a7d447d3dbe2
          REQUIRE_READY: "false"
        run: node scripts/verify-cloudflare-edge.mjs https://canon.foxue.ai
