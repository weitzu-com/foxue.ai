name: Cloudflare corpus edge health

on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * *"

permissions:
  contents: read

concurrency:
  group: cloudflare-corpus-edge-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify authoritative DNS, Worker, release pointer and readiness semantics
        env:
          # Keep these values aligned with the release actually deployed at canon.foxue.ai.
          # Update them in the deployment follow-up commit, never ahead of the Worker.
          EXPECTED_RELEASE_ID: gbcr-6.26.0-2b8ab8d5e4fe-eac6c24781dd-a582cf471b7c-dd80008cb1a9
          EXPECTED_MANIFEST_SHA256: c94718353e37df5f02d9df6552c4a6b246bd6e6501e933f60869699152124bc2
          REQUIRE_READY: "true"
          REQUIRE_MULLER_INDEX: "true"
          REQUIRE_GEMMELL_INDEX: "true"
        run: node scripts/verify-cloudflare-edge.mjs https://canon.foxue.ai
